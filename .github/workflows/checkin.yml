name: Checkin

on:
  schedule:
    # UTC 4:50 = 北京时间 12:55，提前触发，留 5 分钟缓冲对抗 GitHub 延迟
    - cron: '55 4 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 🎯 等到 12:58~12:59 之间的随机时刻
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，直接执行"
          else
            OFFSET=$(shuf -i 0-119 -n 1)
            BASE=$(TZ='Asia/Shanghai' date -d 'today 12:58:00' +%s)
            TARGET=$((BASE + OFFSET))
            WAIT=$((TARGET - $(date +%s)))
            if [ "$WAIT" -gt 0 ]; then
              echo "🎯 将于北京时间 $(TZ='Asia/Shanghai' date -d @${TARGET} +'%H:%M:%S') 执行，等待 ${WAIT} 秒"
              sleep "$WAIT"
            else
              echo "⚠️ GitHub 触发延迟已超过目标时刻，立即执行"
            fi
          fi

      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🏗️ 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装依赖
        run: pip install requests beautifulsoup4

      - name: ✅ 运行签到脚本并记录日志
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          USER1: ${{ secrets.USER1 }}
          PASS1: ${{ secrets.PASS1 }}
        run: |
          python checkin.py 2>&1 | tee output.txt

          DATETIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')

          REMAINING=$(grep -oP '剩余流量: \K[^\s]+' output.txt || echo "未知")
          RESULT=$(grep -oP '签到结果: \K.*' output.txt || echo "未知")
          TRAFFIC=$(grep -oP '获得了?\s*\K[\d.]+\s*(MB|GB|TB)' output.txt || echo "0MB")

          if [ ! -f checkin.log ]; then
            echo "====================================================================" >> checkin.log
            echo "                        69云自动签到日志                              " >> checkin.log
            echo "====================================================================" >> checkin.log
            echo "日期        时间      | 剩余流量    | 签到流量  | 签到结果" >> checkin.log
            echo "--------------------------------------------------------------------" >> checkin.log
          fi

          echo "${DATETIME} | ${REMAINING} | ${TRAFFIC} | ${RESULT}" >> checkin.log
          echo "📝 日志已记录"
          cat checkin.log
        timeout-minutes: 5

      - name: 📝 提交日志到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add checkin.log
          git diff --staged --quiet || git commit -m "📝 签到日志 $(TZ='Asia/Shanghai' date +'%Y-%m-%d')"
          git push

      - name: 📌 执行完成
        run: echo "签到任务已完成 ✅"

  keepalive-workflow:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: checkin
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
